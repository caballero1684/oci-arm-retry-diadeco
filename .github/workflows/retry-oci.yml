name: Reintento Automatico OCI ARM con Notificacion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  retry-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python e Instalar OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configurar Credenciales OCI
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: "mx-queretaro-1"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_CLI_KEY_CONTENT }}
          EOF
          
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          EOF
          
          chmod 600 ~/.oci/config

      - name: Crear Apply Job en Resource Manager y Monitorear
        id: oci_job
        env:
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          # Pausa de 15 segundos previa para evitar la ráfaga de peticiones
          sleep 15

          # Crear el job de ejecución agregando la estrategia de reintentos
          JOB_ID=$(oci resource-manager job create-apply-job \
            --stack-id ${{ secrets.OCI_STACK_ID }} \
            --execution-plan-strategy AUTO_APPROVED \
            --max-retries 5 \
            --query 'data.id' --raw-output)
          
          echo "Job creado con ID: $JOB_ID"
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT

          sleep 45
          
          JOB_STATUS=$(oci resource-manager job get \
            --job-id $JOB_ID \
            --max-retries 5 \
            --query 'data."lifecycle-state"' --raw-output)
          
          echo "Estado del Job: $JOB_STATUS"
          echo "job_status=$JOB_STATUS" >> $GITHUB_OUTPUT

      - name: Enviar Correo de Exito
        if: steps.oci_job.outputs.job_status == 'SUCCEEDED'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🎉 ¡Instancia OCI ARM Creada Exitosamente!"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "OCI Automation <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            ¡La solicitud de capacidad para tu máquina virtual ARM en OCI ha sido completada con éxito!
            
            Detalles del Job:
            - Stack ID: ${{ secrets.OCI_STACK_ID }}
            - Job ID: ${{ steps.oci_job.outputs.job_id }}
            - Estado: SUCCEEDED
            
            Puedes ingresar a la consola de Oracle Cloud Infrastructure para verificar el estado de la instancia.
